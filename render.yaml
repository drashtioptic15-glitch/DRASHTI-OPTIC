services:
  # ----------------------------------------------------
  # Unified Frontend + Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: drashti-optic
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BACKEND_PORT
        value: 5000
